services:

  api:
    build: ./api
    volumes:
      - ./api:/app
    env_file:
      - .env
    environment:
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    ports:
      - "8001:8000"
    depends_on:
      - redis

  whatsapp:
    build: ./whatsapp-service
    volumes:
      - ./whatsapp-service/runtime:/app/runtime
    depends_on:
      - api
      - redis
    restart: unless-stopped

  redis:
    image: redis:7
    ports:
      - "6379:6379"